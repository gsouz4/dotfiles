onboarding = false
# herdr — terminal workspace manager for AI coding agents
# Full reference: herdr --default-config  |  https://herdr.dev/docs/configuration/
# Reload after editing: herdr server reload-config  (or prefix+shift+r)

[theme]
# name = "catppuccin"
name = "gruvbox"
# name = "gruvbox"


auto_switch = false
[keys]
# Matches the tmux prefix in ~/.tmux.conf (set -g prefix C-Space) so muscle
# memory carries over. Avoid shift+letter prefixes: terminals send a bare
# uppercase char, so herdr would swallow every capital letter you type.
prefix = "ctrl+space"

# Sounds only fire for agents in *background* workspaces. There is no switch
# that mutes needs-attention while keeping done, so this disables both and
# relies on the in-app toast below for a visual cue instead.
[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[ui]
agent_panel_sort = "priority"

# AI usage dashboard (ai-usagebar-tui) in a temporary vertical pane.
# type = "pane" closes the pane when the TUI exits (press q).
[[keys.command]]
key = "prefix+u"
type = "pane"
command = "$HOME/.cargo/bin/ai-usagebar-tui"

[experimental]
# Kitty graphics passthrough (added in 0.8.x, off by default). Ghostty
# implements the protocol, so panes can show real pixels — required by
# terminal-browser and the markdown preview flow.
kitty_graphics = true
