# Ghostty/Kitty graphics protocol support.
# allow-passthrough lets image escape sequences reach the outer terminal.
# update-environment propagates Ghostty env vars on reattach.
set -g allow-passthrough on
set -ga update-environment "GHOSTTY_RESOURCES_DIR TERM_PROGRAM"

# Extended keys for modified Enter/etc in TUI apps (pi, etc)
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Forward focus events to TUIs (nvim autoread, tu, etc)
set -g focus-events on

# Mouse and vi mode
set -g mouse on
setw -g mode-keys vi
set-window-option -g mode-keys vi
set -g history-limit 100000

# Wheel always scrolls pane history, even inside apps that grab the mouse
# (Claude Code, vim, less). Enters copy-mode on scroll-up, auto-exits at bottom.
# Trade-off: those apps no longer receive wheel/click events.
bind -n WheelUpPane copy-mode -e
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# Prefix
bind-key b send-prefix
set -g prefix C-b
unbind-key C-h
bind-key C-b send-prefix

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Open new panes/windows in current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Reset highlights when entering (used by Claude notify hook)
set-hook -g after-select-window 'set-window-option window-status-format " #I #W "'
set-hook -g client-session-changed 'set-option status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#313244,nobold] "'

# Theme (Catppuccin Mocha)
set -g status-position bottom
set -g status-style "bg=#313244,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#313244,nobold] "
set -g status-interval 1
set -g status-right "#[fg=#cdd6f4,bg=#313244]#(cat /tmp/claude-statusline-#{pane_id} 2>/dev/null) #(~/.local/bin/tmux-pi-status.sh) "
set -g status-right-length 120
set -g status-left-length 20
set -g status-justify left
set -g window-status-style "fg=#a6adc8,bg=#313244"
set -g window-status-last-style "fg=#a6adc8,bg=#313244"
set -g window-status-separator "#[fg=#6c7086,bg=#313244] · "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I #W#{?window_zoomed_flag, Z,} "
set -g message-style "bg=#45475a,fg=#cdd6f4"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-status off
set -g pane-border-format "#{?pane_active,#[fg=#1e1e2e#,bg=#a6e3a1] #{pane_index}:#{pane_current_command} #[default],#[fg=#6c7086#,bg=#313244] #{pane_index}:#{pane_current_command} #[default]}"

# Copy mode (macOS pbcopy)
set-option -g default-command "which reattach-to-user-namespace > /dev/null && reattach-to-user-namespace -l $SHELL || $SHELL"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "reattach-to-user-namespace pbcopy"

# Annotation buffer: 'a' in copy mode to annotate, prefix+B to open, prefix+S to paste
bind-key -T copy-mode-vi a send-keys -X copy-pipe-no-clear "cat > /tmp/.abuf-sel" \; display-popup -E -w 50% -h 50% -x R -y 1 -T " annotation buffer (:wq save, :q close) " ~/.local/bin/abuf-edit
bind-key B display-popup -E -w 50% -h 50% -x R -y 1 -T " annotation buffer (:wq save, :q close) " ~/.local/bin/abuf-edit
bind-key S run-shell "~/.local/bin/abuf-paste '#{pane_id}'"
bind-key C-x confirm-before -p "Clear annotation buffer? (y/n)" "run-shell ~/.local/bin/abuf-clear"
